<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Profile</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gradient-to-br from-blue-100 via-white to-indigo-100 min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-3xl bg-white shadow-2xl rounded-3xl overflow-hidden">

    <!-- Header -->
    <div class="bg-gradient-to-r from-indigo-600 to-blue-500 p-8 text-white">
      <h2 class="text-4xl font-bold mb-2">Create Your Profile</h2>

      <p class="text-blue-100 text-lg">
        Tell us a little about yourself — this information will help build your CV.
      </p>
    </div>

    <!-- Form -->
    <form method="POST" class="p-8 space-y-6">
      {% csrf_token %}

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- Name -->
        <div>
          <label class="block text-gray-700 font-semibold mb-2">
            Full Name
          </label>

          <input
            type="text"
            name="name"
            placeholder="Enter your full name"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-4 focus:ring-blue-200 focus:border-blue-500 transition"
          />
        </div>

        <!-- Email -->
        <div>
          <label class="block text-gray-700 font-semibold mb-2">
            Email Address
          </label>

          <input
            type="email"
            name="email"
            placeholder="Enter your email"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-4 focus:ring-blue-200 focus:border-blue-500 transition"
          />
        </div>

        <!-- Phone -->
        <div>
          <label class="block text-gray-700 font-semibold mb-2">
            Phone Number
          </label>

          <input
            type="text"
            name="phone"
            placeholder="Enter your phone number"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-4 focus:ring-blue-200 focus:border-blue-500 transition"
          />
        </div>

        <!-- Degree -->
        <div>
          <label class="block text-gray-700 font-semibold mb-2">
            Degree
          </label>

          <input
            type="text"
            name="degree"
            placeholder="Enter your degree"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-4 focus:ring-blue-200 focus:border-blue-500 transition"
          />
        </div>

        <!-- University -->
        <div class="md:col-span-2">
          <label class="block text-gray-700 font-semibold mb-2">
            University
          </label>

          <input
            type="text"
            name="university"
            placeholder="Enter your university name"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-4 focus:ring-blue-200 focus:border-blue-500 transition"
          />
        </div>

        <!-- Summary -->
        <div class="md:col-span-2">
          <label class="block text-gray-700 font-semibold mb-2">
            Professional Summary
          </label>

          <textarea
            name="summary"
            rows="4"
            placeholder="Write a short summary about yourself..."
            class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-4 focus:ring-blue-200 focus:border-blue-500 transition resize-none"
          ></textarea>
        </div>

        <!-- Previous Work -->
        <div class="md:col-span-2">
          <label class="block text-gray-700 font-semibold mb-2">
            Previous Work Experience
          </label>

          <textarea
            name="previous_work"
            rows="3"
            placeholder="Enter your previous work experience"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-4 focus:ring-blue-200 focus:border-blue-500 transition resize-none"
          ></textarea>
        </div>

        <!-- Skills -->
        <div class="md:col-span-2">
          <label class="block text-gray-700 font-semibold mb-2">
            Skills
          </label>

          <input
            type="text"
            name="skills"
            placeholder="Python, Django, REST API, Tailwind CSS..."
            class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-4 focus:ring-blue-200 focus:border-blue-500 transition"
          />
        </div>

      </div>

      <!-- Button -->
      <div class="pt-4">
        <button
          type="submit"
          class="w-full bg-gradient-to-r from-indigo-600 to-blue-500 text-white py-4 rounded-xl text-lg font-semibold shadow-lg hover:scale-[1.02] hover:shadow-2xl transition duration-300"
        >
          Create Profile
        </button>
      </div>

    </form>
  </div>

</body>
</html>
