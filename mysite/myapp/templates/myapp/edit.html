<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Resume</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
</head>

<body class="bg-gradient-to-br from-indigo-100 via-white to-blue-100 min-h-screen flex items-center justify-center px-4 py-10">

    <div
        class="w-full max-w-4xl bg-white shadow-2xl rounded-3xl overflow-hidden"
    >

        <!-- HEADER -->
        <div
            class="bg-gradient-to-r from-indigo-700 via-blue-700 to-sky-600 px-10 py-8"
        >

            <div class="flex items-center gap-4">

                <div
                    class="w-16 h-16 rounded-2xl bg-white/20 backdrop-blur-lg flex items-center justify-center"
                >
                    <i class="fa-solid fa-pen-to-square text-white text-2xl"></i>
                </div>

                <div>
                    <h1 class="text-4xl font-bold text-white">
                        Edit Resume
                    </h1>

                    <p class="text-white/80 mt-1 text-lg">
                        Update your professional information
                    </p>
                </div>

            </div>

        </div>

        <!-- FORM -->
        <form method="POST" class="p-10 space-y-8">

            {% csrf_token %}

            <!-- GRID -->
            <div class="grid md:grid-cols-2 gap-8">

                <!-- NAME -->
                <div>
                    <label class="block text-gray-700 font-semibold mb-3">
                        Full Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        value="{{ profile.name }}"
                        class="w-full border border-gray-300 rounded-2xl px-5 py-4 text-lg focus:outline-none focus:ring-4 focus:ring-indigo-200 focus:border-indigo-500 transition"
                    >
                </div>

                <!-- EMAIL -->
                <div>
                    <label class="block text-gray-700 font-semibold mb-3">
                        Email Address
                    </label>

                    <input
                        type="email"
                        name="email"
                        value="{{ profile.email }}"
                        class="w-full border border-gray-300 rounded-2xl px-5 py-4 text-lg focus:outline-none focus:ring-4 focus:ring-indigo-200 focus:border-indigo-500 transition"
                    >
                </div>

                <!-- PHONE -->
                <div>
                    <label class="block text-gray-700 font-semibold mb-3">
                        Phone Number
                    </label>

                    <input
                        type="text"
                        name="phone"
                        value="{{ profile.phone }}"
                        class="w-full border border-gray-300 rounded-2xl px-5 py-4 text-lg focus:outline-none focus:ring-4 focus:ring-indigo-200 focus:border-indigo-500 transition"
                    >
                </div>

                <!-- DEGREE -->
                <div>
                    <label class="block text-gray-700 font-semibold mb-3">
                        Degree
                    </label>

                    <input
                        type="text"
                        name="degree"
                        value="{{ profile.degree }}"
                        class="w-full border border-gray-300 rounded-2xl px-5 py-4 text-lg focus:outline-none focus:ring-4 focus:ring-indigo-200 focus:border-indigo-500 transition"
                    >
                </div>

                <!-- UNIVERSITY -->
                <div class="md:col-span-2">
                    <label class="block text-gray-700 font-semibold mb-3">
                        University
                    </label>

                    <input
                        type="text"
                        name="university"
                        value="{{ profile.university }}"
                        class="w-full border border-gray-300 rounded-2xl px-5 py-4 text-lg focus:outline-none focus:ring-4 focus:ring-indigo-200 focus:border-indigo-500 transition"
                    >
                </div>

            </div>

            <!-- SUMMARY -->
            <div>
                <label class="block text-gray-700 font-semibold mb-3">
                    Professional Summary
                </label>

                <textarea
                    name="summary"
                    rows="5"
                    class="w-full border border-gray-300 rounded-2xl px-5 py-4 text-lg focus:outline-none focus:ring-4 focus:ring-indigo-200 focus:border-indigo-500 transition"
                >{{ profile.summary }}</textarea>
            </div>

            <!-- EXPERIENCE -->
            <div>
                <label class="block text-gray-700 font-semibold mb-3">
                    Work Experience
                </label>

                <textarea
                    name="previous_work"
                    rows="5"
                    class="w-full border border-gray-300 rounded-2xl px-5 py-4 text-lg focus:outline-none focus:ring-4 focus:ring-indigo-200 focus:border-indigo-500 transition"
                >{{ profile.previous_work }}</textarea>
            </div>

            <!-- SKILLS -->
            <div>
                <label class="block text-gray-700 font-semibold mb-3">
                    Skills
                </label>

                <input
                    type="text"
                    name="skills"
                    value="{{ profile.skills }}"
                    class="w-full border border-gray-300 rounded-2xl px-5 py-4 text-lg focus:outline-none focus:ring-4 focus:ring-indigo-200 focus:border-indigo-500 transition"
                >
            </div>

            <!-- BUTTONS -->
            <div class="flex flex-wrap gap-5 pt-4">

                <button
                    type="submit"
                    class="bg-gradient-to-r from-indigo-700 to-blue-600 text-white px-8 py-4 rounded-2xl text-lg font-semibold shadow-xl hover:scale-105 transition duration-300"
                >
                    <i class="fa-solid fa-floppy-disk mr-2"></i>
                    Update Resume
                </button>

                <a
                    href="{% url 'dashboard' %}"
                    class="bg-gray-700 text-white px-8 py-4 rounded-2xl text-lg font-semibold shadow-xl hover:bg-black transition duration-300"
                >
                    <i class="fa-solid fa-arrow-left mr-2"></i>
                    Back
                </a>

            </div>

        </form>

    </div>

</body>
</html>
